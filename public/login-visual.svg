<svg width="1000" height="1000" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#06151D" flood-opacity="0.22"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#06151D" flood-opacity="0.16"/>
    </filter>
    <linearGradient id="scanFace" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173440"/>
      <stop offset="1" stop-color="#0B1F2A"/>
    </linearGradient>
    <linearGradient id="greenFlow" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7AE0B8"/>
      <stop offset="1" stop-color="#087F5B"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F5F1E8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A8E67"/>
      <stop offset="1" stop-color="#056247"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(335 432) rotate(90) scale(240)">
      <stop stop-color="#0EA876" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0EA876" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="scannerClip">
      <rect x="132" y="262" width="330" height="330" rx="78"/>
    </clipPath>
  </defs>

  <!-- subtle radial context -->
  <circle cx="325" cy="430" r="260" stroke="#7AE0B8" stroke-opacity="0.16" stroke-width="2"/>
  <circle cx="325" cy="430" r="210" stroke="#7AE0B8" stroke-opacity="0.08" stroke-width="2" stroke-dasharray="7 10"/>
  <circle cx="335" cy="432" r="240" fill="url(#glow)"/>

  <!-- scanner backing -->
  <g filter="url(#shadow)">
    <rect x="114" y="244" width="352" height="352" rx="86" fill="#12303B"/>
    <rect x="126" y="256" width="328" height="328" rx="78" fill="url(#scanFace)" stroke="#274D59" stroke-width="3"/>
  </g>

  <!-- scanner frame highlights -->
  <path d="M167 343C167 318 188 297 213 297H249" stroke="#E8F5EF" stroke-width="5" stroke-linecap="round"/>
  <path d="M412 343C412 318 391 297 366 297H330" stroke="#E8F5EF" stroke-width="5" stroke-linecap="round"/>
  <path d="M167 499C167 524 188 545 213 545H249" stroke="#E8F5EF" stroke-width="5" stroke-linecap="round"/>
  <path d="M412 499C412 524 391 545 366 545H330" stroke="#E8F5EF" stroke-width="5" stroke-linecap="round"/>

  <!-- fingerprint -->
  <g stroke="#9CE7C9" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M277 486C250 467 238 439 243 409C250 366 287 333 332 333C378 333 417 370 417 416"/>
    <path d="M293 508C263 486 250 454 255 420C261 381 293 352 332 352C370 352 400 382 400 418C400 454 384 484 355 505"/>
    <path d="M311 521C282 499 270 467 275 432C280 399 303 375 333 375C365 375 388 400 388 432C388 462 377 487 356 506"/>
    <path d="M329 521C307 501 298 473 302 445C305 420 318 402 334 402C350 402 364 419 364 442C364 467 355 490 340 509"/>
    <path d="M346 479C350 467 352 452 352 438C352 425 345 415 335 415C325 415 318 426 318 440C318 457 322 472 331 485"/>
    <path d="M260 455C252 432 254 408 266 387"/>
    <path d="M393 381C402 397 406 414 406 430"/>
  </g>

  <!-- QR tile -->
  <g transform="translate(120 520) rotate(-9 85 85)" filter="url(#softShadow)">
    <rect width="170" height="170" rx="28" fill="#FBFAF6" stroke="#D9E2DC" stroke-width="2"/>
    <path d="M24 48V30C24 25 29 20 34 20H52" stroke="#087F5B" stroke-width="5" stroke-linecap="round"/>
    <path d="M118 20H136C141 20 146 25 146 30V48" stroke="#087F5B" stroke-width="5" stroke-linecap="round"/>
    <path d="M24 120V138C24 143 29 148 34 148H52" stroke="#087F5B" stroke-width="5" stroke-linecap="round"/>
    <path d="M118 148H136C141 148 146 143 146 138V120" stroke="#087F5B" stroke-width="5" stroke-linecap="round"/>
    <!-- QR simplified -->
    <g fill="#0B1F2A">
      <rect x="40" y="40" width="26" height="26"/><rect x="45" y="45" width="16" height="16" fill="#FBFAF6"/>
      <rect x="104" y="40" width="26" height="26"/><rect x="109" y="45" width="16" height="16" fill="#FBFAF6"/>
      <rect x="40" y="104" width="26" height="26"/><rect x="45" y="109" width="16" height="16" fill="#FBFAF6"/>
      <rect x="77" y="40" width="9" height="9"/><rect x="88" y="40" width="9" height="9"/>
      <rect x="74" y="56" width="9" height="9"/><rect x="85" y="67" width="9" height="9"/>
      <rect x="98" y="72" width="9" height="9"/><rect x="112" y="75" width="9" height="9"/>
      <rect x="74" y="84" width="9" height="9"/><rect x="88" y="84" width="9" height="9"/>
      <rect x="102" y="88" width="9" height="9"/><rect x="118" y="90" width="9" height="9"/>
      <rect x="70" y="102" width="9" height="9"/><rect x="84" y="104" width="9" height="9"/>
      <rect x="98" y="110" width="9" height="9"/><rect x="114" y="112" width="9" height="9"/>
      <rect x="82" y="122" width="9" height="9"/>
    </g>
  </g>

  <!-- data flow -->
  <g opacity="0.95">
    <path d="M432 430C520 430 565 470 630 526C685 573 730 603 804 611" stroke="url(#greenFlow)" stroke-width="9" stroke-linecap="round"/>
    <path d="M425 454C512 459 553 493 618 547C679 597 724 624 803 632" stroke="#7AE0B8" stroke-opacity="0.62" stroke-width="4" stroke-linecap="round"/>
    <path d="M419 478C499 488 541 517 602 567C660 614 712 643 796 653" stroke="#7AE0B8" stroke-opacity="0.34" stroke-width="3" stroke-linecap="round"/>
    <circle cx="518" cy="471" r="8" fill="#B8F0D8"/>
    <circle cx="605" cy="549" r="7" fill="#B8F0D8"/>
    <circle cx="694" cy="611" r="8" fill="#087F5B"/>
  </g>

  <!-- tiny status node -->
  <g transform="translate(544 402)" filter="url(#softShadow)">
    <rect width="74" height="74" rx="20" fill="#FBFAF6" stroke="#DDE6E0"/>
    <circle cx="37" cy="37" r="17" stroke="#173440" stroke-width="4"/>
    <path d="M37 27V38L45 43" stroke="#173440" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- check node -->
  <g transform="translate(648 512)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="42" fill="#0A8E67"/>
    <circle cx="0" cy="0" r="33" stroke="#A5E9CD" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-14 0L-4 11L17 -13" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- payslip back card -->
  <g transform="translate(672 430) rotate(7 150 215)" filter="url(#shadow)">
    <rect x="26" y="22" width="270" height="404" rx="36" fill="#0E5D4A"/>
    <rect width="280" height="416" rx="36" fill="url(#paper)" stroke="#DADFD8" stroke-width="2"/>
    <!-- W1 -->
    <rect x="28" y="30" width="58" height="58" rx="16" fill="url(#accent)"/>
    <text x="57" y="66" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">W1</text>

    <!-- header -->
    <rect x="110" y="36" width="122" height="14" rx="7" fill="#D7DBD7"/>
    <rect x="110" y="61" width="88" height="10" rx="5" fill="#E3E6E2"/>

    <!-- line items -->
    <rect x="28" y="112" width="224" height="188" rx="24" fill="#FFFFFF" fill-opacity="0.72" stroke="#E6E8E3"/>
    <circle cx="50" cy="140" r="6" fill="#0A8E67"/>
    <rect x="68" y="134" width="112" height="12" rx="6" fill="#CFD5D1"/>
    <rect x="203" y="134" width="33" height="12" rx="6" fill="#D9DEDA"/>

    <circle cx="50" cy="178" r="6" fill="#74D8B3"/>
    <rect x="68" y="172" width="94" height="12" rx="6" fill="#CFD5D1"/>
    <rect x="205" y="172" width="31" height="12" rx="6" fill="#D9DEDA"/>

    <circle cx="50" cy="216" r="6" fill="#B6EBD7"/>
    <rect x="68" y="210" width="132" height="12" rx="6" fill="#CFD5D1"/>
    <rect x="208" y="210" width="28" height="12" rx="6" fill="#D9DEDA"/>

    <circle cx="50" cy="254" r="6" fill="#D7E9E0"/>
    <rect x="68" y="248" width="84" height="12" rx="6" fill="#CFD5D1"/>
    <rect x="200" y="248" width="36" height="12" rx="6" fill="#D9DEDA"/>

    <!-- net pay band -->
    <rect x="28" y="320" width="224" height="64" rx="18" fill="#E8F5EF"/>
    <circle cx="54" cy="352" r="18" fill="#087F5B"/>
    <path d="M49 346C49 341 59 340 62 344C65 349 59 352 54 353C48 355 47 360 52 363C56 366 64 363 64 359" stroke="white" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M56 338V367" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <rect x="84" y="340" width="126" height="14" rx="7" fill="#34B284"/>
    <rect x="84" y="361" width="88" height="8" rx="4" fill="#96D9BD"/>
  </g>

  <!-- small payout token -->
  <g transform="translate(826 790) rotate(-8 70 38)" filter="url(#softShadow)">
    <rect width="140" height="76" rx="24" fill="#056247"/>
    <rect x="8" y="8" width="124" height="60" rx="18" fill="#087F5B" stroke="#37B88C"/>
    <circle cx="70" cy="38" r="21" fill="#E8F5EF"/>
    <path d="M64 31C64 26 75 25 79 29C82 33 77 36 70 38C64 39 62 45 67 48C72 51 80 48 80 44" stroke="#087F5B" stroke-width="4" stroke-linecap="round"/>
    <path d="M72 22V55" stroke="#087F5B" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- decorative accents -->
  <path d="M733 337C818 310 916 344 950 429" stroke="#7AE0B8" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="951" cy="430" r="8" fill="#8CE3C2"/>
  <circle cx="872" cy="280" r="5" fill="#087F5B" fill-opacity="0.6"/>
</svg>