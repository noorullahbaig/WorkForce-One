name: verify
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate migration chain
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node scripts/validate-migrations.mjs --base "$BASE_SHA"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: npm run build
      - run: npx wrangler deploy --dry-run
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:local
      - run: npm run db:seed:local
      - run: npx playwright test --project=desktop --project=mobile

  deploy:
    needs: [quality, browser-smoke]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check release is current
        id: release-check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_main_sha" = "$RELEASE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping superseded release $RELEASE_SHA; main is now $current_main_sha"
          fi
      - name: Verify Cloudflare deploy credentials
        if: steps.release-check.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Apply remote D1 migrations
        if: steps.release-check.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply workforce-one-demo --remote
      - name: Confirm release is still current
        id: final-release-check
        if: steps.release-check.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          current_main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$current_main_sha" = "$RELEASE_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping superseded release $RELEASE_SHA; main is now $current_main_sha"
          fi
      - name: Deploy Worker
        id: deploy
        if: steps.final-release-check.outputs.current == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - name: Verify deployed database and Worker
        if: steps.final-release-check.outputs.current == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          test -n "$DEPLOYMENT_URL" || { echo "Wrangler did not return a deployment URL"; exit 1; }
          for attempt in {1..10}; do
            if response=$(curl --silent --show-error --fail "$DEPLOYMENT_URL/healthz"); then
              if HEALTH_RESPONSE="$response" node -e 'const health = JSON.parse(process.env.HEALTH_RESPONSE); if (!health.ok) process.exit(1)'; then
                echo "Deployment health check passed: $DEPLOYMENT_URL/healthz"
                exit 0
              fi
            fi
            echo "Health check attempt $attempt failed; retrying"
            sleep 3
          done
          echo "Deployment did not become healthy"
          exit 1
